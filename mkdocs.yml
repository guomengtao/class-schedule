site_name: Ev课程表 技术手册

site_description: Ev课程表——手环快应用开发技术文档手册

site_author: Ev团队

repo_url: https://github.com/your-org/class-schedule

edit_uri: edit/main/docs/


theme:

  name: material

  language: zh

  palette:

    - media: "(prefers-color-scheme: light)"

      scheme: default

      primary: indigo

      accent: indigo

      toggle:

        icon: material/brightness-7

        name: 切换至暗色模式

    - media: "(prefers-color-scheme: dark)"

      scheme: slate

      primary: indigo

      accent: indigo

      toggle:

        icon: material/brightness-4

        name: 切换至亮色模式

  features:

    - navigation.sections

    - navigation.expand

    - navigation.indexes

    - search.suggest

    - search.highlight

    - content.code.copy


markdown_extensions:

  - admonition

  - pymdownx.details

  - pymdownx.superfences

  - pymdownx.highlight

  - pymdownx.inlinehilite

  - pymdownx.tabbed:

      alternate_style: true

  - toc:

      permalink: true

      toc_depth: 3


plugins:

  - search:

      lang: zh


